# 全局设置（第一步：预测模型框架 XGBoost + LightGBM 软测量）
data:
  db_path: data/db/dmdcs.db           # 真实数据优先从数据库读取（init_db.py 建库）；未建库时回退 CSV
  realtime_csv: data/raw/realtime.csv      # 高频实时可测变量（每 5 分钟一行；PLC/数据库导出后导入）
  lab_csv: data/raw/lab.csv                # 低频化验真值（每 2 小时一行；人工化验/LIMS 导出后导入）
  processed_dir: data/processed            # 对齐后的特征宽表目录
  aligned_csv: data/processed/aligned.csv  # 特征宽表（窗口聚合特征 + 化验真值）

# 采样/化验/窗口占位值（真实数据表就绪后只改这里，不改代码）
sample_period_seconds: 300     # 统一采样周期：5 分钟
lab_period_hours: 2            # 化验周期：2 小时
feature_window_minutes: 60     # 特征窗口：化验时刻前 60 分钟

artifacts_dir: artifacts
random_state: 42

# 数据切分：时序数据必须按时间切分（前 train_ratio 训练，后 1-train_ratio 测试），禁止随机切分
split:
  train_ratio: 0.8
  walk_forward:
    enabled: true     # 是否执行 walk-forward 滚动验证（真实数据上线前建议开启）
    n_splits: 3       # 滚动验证折数
    val_fraction: 0.1 # 每折末尾验证段占全量比例

# 模型超参（各预测器先用默认值，再用这里的值覆盖）
model:
  xgboost:
    n_estimators: 300
    max_depth: 6
    learning_rate: 0.08
    subsample: 0.9
    colsample_bytree: 0.9
    tree_method: hist
    device: cpu          # 可选 cuda（Windows 下需源码编译 GPU 版）
  lightgbm:
    n_estimators: 300
    num_leaves: 31
    learning_rate: 0.08
    subsample: 0.9
    colsample_bytree: 0.9
    device_type: cpu     # 可选 gpu（需 GPU 编译版）
  ensemble:
    method: weighted     # best（选最优单模型）| weighted（按 RMSE 倒数加权集成）

# TCN 时序预测（第二步：预测「下一次化验值」；级联+混合输入）
tcn:
  enabled_targets: [clean_ash, medium_viscosity]   # 先做 2 个指标
  window_steps: 48            # 输入历史窗口（步数；48 × 5min = 4 小时）
  horizon_steps: 24           # 预测步长（24 × 5min = 2 小时，对齐化验周期）
  num_filters: 64             # 卷积通道数
  kernel_size: 3              # 卷积核大小
  num_layers: 4               # 残差块层数（膨胀 [1,2,4,8]）
  dropout: 0.1
  lr: 0.001
  epochs: 150
  batch_size: 32
  patience: 20                # 早停轮数（验证集无改善）
  split:
    train_ratio: 0.7
    val_ratio: 0.15           # 测试 = 1 - train - val
