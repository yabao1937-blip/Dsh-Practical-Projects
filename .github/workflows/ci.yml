name: CI

# 目的：把回归防线放进流水线。
# 现状是 76 个 pytest + 8 个 headless 回归脚本全靠手跑（依赖个人自觉），
# 本工作流只跑能在此环境里稳定运行的 pytest（见下方说明），先让"每次 push 都有一道自动防线"。
#
# 说明：需要 Edge 的浏览器回归脚本（scripts/verify_*.js、dump_*.js）现在**部分进 CI** 了：
# e2e 作业跑在 windows-latest（GitHub 的 Windows 镜像自带 Edge，路径与开发机一致），
# 自己起一个后端再跑脚本。之所以必须进 CI：2026-09 的缺陷1（守卫误拒 → 浏览器→服务器
# 同步静默死掉）本可以被 verify_mirror_e2e.js 的用例0 当场抓住，但当时脚本只在个人机器上
# 手跑，于是长期无人执行、慢慢腐烂。跑不动的部分（依赖真实生产库数据的 dump_* 对拍）
# 仍留在本地按需执行。
# 依赖用 requirements.lock.txt（冻结自"76 测试全绿"的环境），避免上游发新版把 CI 打挂。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:      # 允许手动触发

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.11（与开发环境 CPython 3.11.9 同小版本线）
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装锁定依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: 依赖自检（版本冲突会在这里暴露）
        run: pip check

      - name: 全量测试（conftest 已把库隔离到临时 SQLite，不碰真实数据）
        run: python -m pytest -q

      - name: 静态检查（不阻塞：先只做信号，等基线干净后再转为强制）
        continue-on-error: true
        run: |
          pip install ruff
          ruff check app tests --statistics || true

  # 端到端（真浏览器 + 真后端 + 真 SQLite）：
  #   用例0  冷启动空配置的整库写必须不被 stale 守卫拒绝（缺陷1 的复现路径）
  #   用例1  写失败不得静默：待发副本 + 提示 + online 重试后服务器真实收到
  #   （密度决策日志链路：设定密度 → 日志条目 → PUT 落库）
  # 用 windows-latest 是因为 GitHub 的 Windows 镜像自带 Edge，路径与本机一致；
  # ubuntu 镜像没有 Edge（需要单独装 microsoft-edge-stable）。
  # 断言全部落在 stdout 的 PASS/FAIL 上，脚本遇到任一 FAIL 返回非 0，
  # 因此这里不额外加 `|| true`、也不做输出截断（截断会藏掉 FAIL 行）。
  e2e:
    runs-on: windows-latest
    # 必须有上限：脚本里的 CDP 交互一旦挂起，默认 360 分钟才会被判失败（假红占满配额）
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 脚本用的是全局 WebSocket（CDP 长连接）+ 全局 fetch。全局 WebSocket 是 Node 21+
      # 才有的，而镜像自带的 node 可能是 20.x → 不固定版本会以 ReferenceError 红在
      # 与代码无关的地方。本机验证版本为 v24.15.0。
      - name: 固定 Node 22（脚本依赖全局 WebSocket）
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装锁定依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: 确认浏览器可用（缺失则直接失败，不要静默跳过）
        shell: pwsh
        run: |
          $cands = @(
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe"
          )
          $edge = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw "未找到 Edge，候选: $($cands -join ' , ')" }
          node --version
          Write-Host "Edge: $edge"

      # 关键：起后端、跑脚本、停后端必须在**同一个 step** 里。
      # GitHub 运行器在每个 step 结束时回收该步骤的进程树 —— 2026-09-11 实测：
      # 上一步 Start-Process 起的 uvicorn，到下一步就已经死了，脚本只报
      # `fetch failed`，而"等待就绪"那一步明明刚探到 200（这正是 e2e 一直红的原因）。
      # 失败时发 GitHub annotation：注解可经公开 API 读到，而作业日志需要管理员权限。
      - name: 起后端 → 跑两个 E2E 脚本 → 停后端（完整输出，不截断）
        shell: pwsh
        run: |
          $srvOut = "$env:TEMP\ci-server.log"
          $srvErr = "$env:TEMP\ci-server.err.log"
          $server = Start-Process -FilePath "python" `
            -ArgumentList "-m","uvicorn","app.main:app","--host","127.0.0.1","--port","8000" `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $srvOut -RedirectStandardError $srvErr
          $failed = @()
          try {
            # 探针用短超时（连接被拒是立刻返回的；只有"端口被别的东西占着"才吃满超时）
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              try {
                $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8000/api/v1/health" -TimeoutSec 2
                if ($r.StatusCode -eq 200) {
                  Write-Host "后端就绪（第 $($i+1) 次探测，用时 $([int]$sw.Elapsed.TotalSeconds) 秒）"
                  $ready = $true; break
                }
              } catch { Start-Sleep -Milliseconds 800 }
            }
            if (-not $ready) {
              Write-Host "---- $srvOut ----"; Get-Content $srvOut -ErrorAction SilentlyContinue
              Write-Host "---- $srvErr ----"; Get-Content $srvErr -ErrorAction SilentlyContinue
              throw "后端在约 $([int]$sw.Elapsed.TotalSeconds) 秒内未就绪（上限 45 次探测）"
            }

            # allowReal：CI 的三个用例**顺序共用同一个库**，跑到第三个时库里已有前两个
            # 用例播种的记录，于是"非空库拒跑"会把它挡下（本地是各起一个全新临时库才没暴露）。
            # CI 的库是一次性的、且本来就归这些用例所有，所以只给第三个用例显式放行；
            # 前两个仍保持严格 —— 那条守卫是给"人对着真实库跑"准备的。
            $cases = @(
              @{ name = '镜像写路径'; file = 'scripts/verify_mirror_e2e.js'; allowReal = $null },
              @{ name = '密度决策日志'; file = 'scripts/verify_decision_log.js'; allowReal = $null },
              @{ name = '实测密度计(仅展示)'; file = 'scripts/verify_density_actual.js'; allowReal = '1' }
            )
            foreach ($c in $cases) {
              $log = Join-Path $env:TEMP ("e2e-" + [IO.Path]::GetFileNameWithoutExtension($c.file) + ".log")
              Write-Host "==== $($c.name)：node $($c.file) ===="
              if ($c.allowReal) { $env:DMCS_ALLOW_REAL_DB = $c.allowReal } else { Remove-Item Env:\DMCS_ALLOW_REAL_DB -ErrorAction SilentlyContinue }
              & node $c.file *>&1 | Tee-Object -FilePath $log
              $code = $LASTEXITCODE
              if ($code -ne 0) {
                $tail = ((Get-Content $log -Tail 12 -ErrorAction SilentlyContinue) -join ' / ') -replace '[\r\n]+', ' '
                Write-Host "::error title=$($c.name)失败(exit=$code)::$tail"
                $failed += "$($c.name)(exit=$code)"
              }
            }
          } finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
              Write-Host "已停止后端 PID $($server.Id)"
            }
            Write-Host "---- server.err.log（末尾）----"
            Get-Content $srvErr -Tail 20 -ErrorAction SilentlyContinue
          }
          if ($failed.Count -gt 0) { throw "E2E 失败: $($failed -join ' , ')" }

      - name: 失败时输出后端日志（成功时不打印，避免噪音）
        if: failure()
        shell: pwsh
        run: |
          Write-Host "---- server.log ----"; Get-Content "$env:TEMP\ci-server.log" -ErrorAction SilentlyContinue
          Write-Host "---- server.err.log ----"; Get-Content "$env:TEMP\ci-server.err.log" -ErrorAction SilentlyContinue

      # 兜底收尾：自托管 runner 上若还有残留的 8000 监听进程，会让下一次运行以
      # "端口被占"的假红开始。（正常路径已在上一个 step 的 finally 里停掉；
      # 而且 GitHub 运行器本身在 step 结束时会回收进程树，这里只是双保险。）
      - name: 收尾：确保没有残留的后端占着 8000（无论成败）
        if: always()
        shell: pwsh
        run: |
          $conns = Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue
          if (-not $conns) { Write-Host "8000 无监听进程"; exit 0 }
          foreach ($c in $conns) {
            $proc = Get-Process -Id $c.OwningProcess -ErrorAction SilentlyContinue
            if ($proc -and $proc.ProcessName -like "python*") {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              Write-Host "已停止残留后端 PID $($proc.Id)"
            } else {
              Write-Host "8000 被非 python 进程占用: $($proc.ProcessName) (PID $($c.OwningProcess))，未处理"
            }
          }
